<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AIGP Study Plan — Zaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0C0F14; color: #E8E4DC; font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .day-row:hover { background: rgba(255,255,255,0.04) !important; }
    .phase-tab:hover { opacity: 0.85; }
    .check-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const PHASES = [
      {
        id: "foundation", label: "Phase 1", title: "AIGP Foundations",
        subtitle: "Chapters 1–3 · Domain I", color: "#E8C547", weeks: "Weeks 1–2",
        days: [
          { day:1, chapter:"Ch 1: AI and AI Governance", focus:"What is AI? Types, capabilities, limitations. Why governance exists.", task:"Read Ch 1 intro sections. Write Mongolian post: 'AI засаглал гэж юу вэ?'", apac:null, exam:"Domain I.A — Know AI definitions and types" },
          { day:2, chapter:"Ch 1: AI and AI Governance (cont.)", focus:"AI risks and harms: individual, group, organizational, societal.", task:"Complete Ch 1. Flashcard: 5 types of AI harm. Mongolian post: AI-ийн эрсдэл.", apac:null, exam:"Domain I.A — Identify risk types" },
          { day:3, chapter:"Ch 2: Organizational Readiness", focus:"AI governance roles & responsibilities. AI inventory. Stakeholder mapping. How organizations prepare for AI governance (pp.29–70).", task:"Read Ch 2 first half (pp.29–50). Map roles to a Mongolian NGO or UN agency context.", apac:null, exam:"Domain I.B — Organizational readiness" },
          { day:4, chapter:"Ch 2: Organizational Readiness (cont.)", focus:"AI governance committees, training culture, third-party oversight, vendor management. Building organizational AI readiness.", task:"Complete Ch 2 (pp.50–70). Ch 2 review questions. Mongolian post: 'Байгууллага AI-д хэрхэн бэлдэх вэ?'", apac:null, exam:"Domain I.B — Governance structures & vendor oversight" },
          { day:5, chapter:"Ch 3: Updating Policies for AI", focus:"Reviewing and updating existing policies for AI use. Acceptable use policies. HR, legal, and procurement policy updates (pp.71–98).", task:"Read Ch 3 first half (pp.71–85). Draft what an AI acceptable use policy would look like for a Mongolian org.", apac:null, exam:"Domain I.C — AI policy development" },
          { day:6, chapter:"Ch 3: Updating Policies for AI (cont.)", focus:"AI incident response policies. Transparency and disclosure policies. Keeping policies current as AI evolves.", task:"Complete Ch 3 (pp.85–98). Do Ch 1–3 review questions. Mongolian post: 'AI бодлогыг хэрхэн шинэчлэх вэ?'", apac:null, exam:"Domain I.C — AI policy lifecycle" },
          { day:7, chapter:"⟳ Week 1 Review", focus:"Consolidate Ch 1–3. Sybex online flashcards. Self-assessment quiz.", task:"Do Ch 1–3 end-of-chapter questions. Review any weak areas. Rest day allowed.", apac:null, exam:"Full Domain I review", isReview:true },
          { day:8, chapter:"APAC Deep Dive — Singapore 🇸🇬", focus:"Model AI Governance Framework (2020, updated 2024). AI Verify. NAIS 2.0. Agentic AI Framework (Jan 2026) — world's first.", task:"Read IMDA's framework summary online (free). This is the HOST country of your July conference.", apac:"singapore", exam:"Domain II — Non-binding frameworks" },
          { day:9, chapter:"APAC Deep Dive — South Korea 🇰🇷", focus:"AI Basic Act (effective Jan 2026) — APAC's first comprehensive AI law. High-impact AI obligations, labeling, human oversight.", task:"Read FPF or IAPP summary of Korea AI Basic Act. Mongolian post: APAC-ийн анхны AI хууль.", apac:"korea", exam:"Domain II — Binding AI laws" },
          { day:10, chapter:"APAC Deep Dive — China 🇨🇳", focus:"Algorithm Recommendation Rules, Deep Synthesis Regulations, Generative AI Measures. Content labeling mandate (2025). State control model.", task:"Read GDPR Local or Sidley APAC overview on China. Note contrast with Singapore.", apac:"china", exam:"Domain II — National AI laws" },
          { day:11, chapter:"APAC Deep Dive — Japan & Australia 🇯🇵🇦🇺", focus:"Japan: voluntary, innovation-first, Basic Law for Responsible AI in progress. Australia: voluntary AI Safety Standard → shifting to principles-based approach.", task:"Read Fisher Phillips APAC overview. Mongolian post: 'Өөр өөр хандлага — Япон ба Австрали'", apac:"japan-australia", exam:"Domain II — Voluntary vs mandatory frameworks" },
          { day:12, chapter:"APAC Deep Dive — India, ASEAN & Others 🌏", focus:"India: DPDP Act (AI data governance). ASEAN Guide on AI Governance & Ethics (7 principles, updated 2025 for GenAI, voluntary). Thailand, Vietnam, Indonesia.", task:"Read FinregE APAC roundup. Map ASEAN's 7 principles to your focus areas.", apac:"asean", exam:"Domain II — Regional frameworks" },
          { day:13, chapter:"APAC Synthesis + Conference Prep", focus:"Compare regulatory approaches: binding vs voluntary, risk-based vs principles-based, innovation-first vs safety-first.", task:"Make a comparison chart. Draft 3 talking points for Singapore conference. Mongolian post: APAC AI зохицуулалтын ялгаа.", apac:"synthesis", exam:"Domain II — Framework comparison" },
          { day:14, chapter:"⟳ Week 2 Review", focus:"APAC regulatory landscape consolidation. Flashcards: 1 key fact per country.", task:"Quiz yourself: name the key law/framework for each APAC country. Review any gaps.", apac:null, exam:"Domain II APAC knowledge check", isReview:true },
        ]
      },
      {
        id: "laws", label: "Phase 2", title: "Laws & Frameworks",
        subtitle: "Chapters 4–7 · Domain II", color: "#5EC4A8", weeks: "Weeks 3–4",
        days: [
          { day:15, chapter:"Ch 4: Privacy and Data Protection Law", focus:"GDPR, data subject rights, lawful basis for processing. How privacy law governs AI data.", task:"Read Ch 4 first half. Connect to child data protection in Mongolia.", apac:null, exam:"Domain II.A — Privacy law foundations" },
          { day:16, chapter:"Ch 4: Privacy and Data Protection Law (cont.)", focus:"Automated decision-making under GDPR Art. 22. Algorithmic accountability. Data minimization in AI.", task:"Complete Ch 4. Flashcards: GDPR key articles. Mongolian post: 'AI ба хувийн мэдээлэл'", apac:null, exam:"Domain II.A — Automated decisions" },
          { day:17, chapter:"Ch 5: Sectoral and Civil Laws", focus:"AI in healthcare, finance, employment, education. Sector-specific obligations.", task:"Read Ch 5. Focus on child welfare/social services sector applications.", apac:null, exam:"Domain II.B — Sector-specific law" },
          { day:18, chapter:"Ch 5: Sectoral and Civil Laws (cont.)", focus:"Civil liability for AI harm. Tort law and AI. Non-discrimination law.", task:"Complete Ch 5. Mongolian post: 'AI-ийн хохирлыг хэн хариуцах вэ?'", apac:null, exam:"Domain II.B — AI liability" },
          { day:19, chapter:"Ch 6: The EU AI Act", focus:"Risk tiers: unacceptable / high / limited / minimal. Obligations per tier. Prohibited AI uses.", task:"Read Ch 6 first half. Make risk tier diagram. This is the global benchmark.", apac:null, exam:"Domain II.C — EU AI Act structure" },
          { day:20, chapter:"Ch 6: The EU AI Act (cont.)", focus:"High-risk AI in child welfare context. Transparency obligations. GPAI (general-purpose AI) rules.", task:"Complete Ch 6. Compare EU risk tiers to South Korea AI Basic Act structure.", apac:null, exam:"Domain II.C — High-risk AI categories" },
          { day:21, chapter:"⟳ Week 3 Review", focus:"Ch 4–6 consolidation. EU AI Act vs APAC approaches: binding vs voluntary.", task:"End-of-chapter questions Ch 4–6. Practice exam questions. Mongolian post: EU AI хууль ба Ази.", apac:null, exam:"Domain II mid-review", isReview:true },
          { day:22, chapter:"Ch 7: AI Standards and Frameworks", focus:"NIST AI RMF (Govern, Map, Measure, Manage). ISO/IEC 42001. OECD AI Principles.", task:"Read Ch 7 first half. Download NIST AI RMF overview (free PDF).", apac:null, exam:"Domain II.D — International standards" },
          { day:23, chapter:"Ch 7: AI Standards and Frameworks (cont.)", focus:"UNESCO Recommendation on AI Ethics. UNICEF Policy Guidance on AI for Children. How frameworks connect to child protection.", task:"Complete Ch 7. Mongolian post: 'Хүүхдийн эрхийг AI-аас хамгаалах олон улсын стандарт'", apac:null, exam:"Domain II.D — UNESCO/UNICEF frameworks" },
          { day:24, chapter:"Conference Prep — Singapore Topics", focus:"Review Singapore's AI Verify tool. ASEAN AI governance 2025 update. Global AI Assurance Pilot (IMDA, Feb 2025).", task:"Read IAPP Singapore profile. Draft 5 questions you want answered at the conference.", apac:"singapore", exam:"Domain II — Assurance frameworks" },
          { day:25, chapter:"Domain II Synthesis", focus:"Map all laws + frameworks to AIGP Domain II competencies. Identify exam hot spots.", task:"Create master table: Law → Jurisdiction → Key obligation → Exam relevance.", apac:null, exam:"Full Domain II consolidation" },
          { day:26, chapter:"Practice Exam Day", focus:"Sybex online learning center: Domain I + II practice questions.", task:"Aim for 75%+. Log wrong answers. Review corresponding book sections.", apac:null, exam:"Domains I & II mock test", isReview:true },
          { day:27, chapter:"Weak Areas Review", focus:"Target the specific topics where practice exam scores were lowest.", task:"Re-read flagged sections. Make new flashcards. Mongolian post: 'Миний хамгийн хэцүү ойлголт'", apac:null, exam:"Targeted remediation", isReview:true },
          { day:28, chapter:"⟳ Week 4 Review", focus:"Full Phase 2 consolidation. All 7 chapters + APAC knowledge.", task:"Complete all Ch 7 review questions. Update your country comparison chart with framework details.", apac:null, exam:"Phase 2 complete", isReview:true },
        ]
      },
      {
        id: "development", label: "Phase 3", title: "AI Development & Deployment",
        subtitle: "Chapters 8–12 · Domain III & IV", color: "#E87D60", weeks: "Weeks 5–6",
        days: [
          { day:29, chapter:"Ch 8: AI System Design", focus:"AI lifecycle. Design principles for responsible AI. Privacy-by-design in AI.", task:"Read Ch 8 first half. Think: how would a child-protection AI system be designed responsibly?", apac:null, exam:"Domain III.A — AI design principles" },
          { day:30, chapter:"Ch 8: AI System Design (cont.)", focus:"Bias mitigation in design. Explainability. Fairness-aware ML. Documentation.", task:"Complete Ch 8. Mongolian post: 'AI-ийг зөв зохион бүтээх нь'", apac:null, exam:"Domain III.A — Fairness & explainability" },
          { day:31, chapter:"Ch 9: Data Governance and Model Training", focus:"Data quality, provenance, consent. Training data risks. Bias amplification.", task:"Read Ch 9 first half. Connect to child data protection in AI training contexts.", apac:null, exam:"Domain III.B — Data governance" },
          { day:32, chapter:"Ch 9: Data Governance and Model Training (cont.)", focus:"Model cards, datasheets. Testing for fairness. Third-party data risks.", task:"Complete Ch 9. Mongolian post: 'AI сургалтын өгөгдөл ба хүүхдийн эрх'", apac:null, exam:"Domain III.B — Model documentation" },
          { day:33, chapter:"Ch 10: Deployment and Monitoring", focus:"Pre-deployment testing. Human oversight mechanisms. Monitoring in production.", task:"Read Ch 10 first half. Note: Singapore's AI Verify aligns with this chapter.", apac:"singapore", exam:"Domain IV.A — Deployment governance" },
          { day:34, chapter:"Ch 10: Deployment and Monitoring (cont.)", focus:"AI incident response. Feedback loops. Transparency to users. Agentic AI oversight.", task:"Complete Ch 10. Mongolian post: 'AI-ийг ажлуулах үеийн хяналт'", apac:null, exam:"Domain IV.A — Monitoring & incidents" },
          { day:35, chapter:"⟳ Week 5 Review", focus:"Ch 8–10 consolidation. Domain III + IV first half.", task:"End-of-chapter questions. Flashcards: deployment lifecycle. Update study tracker.", apac:null, exam:"Domains III–IV mid-review", isReview:true },
          { day:36, chapter:"Ch 11: AI Risk Management and Assurance", focus:"Risk assessment frameworks. Conformity assessment. Third-party audits. ISO 42001 implementation.", task:"Read Ch 11 first half. This is central to AIGP exam — study carefully.", apac:null, exam:"Domain IV.B — Risk management" },
          { day:37, chapter:"Ch 11: AI Risk Management and Assurance (cont.)", focus:"AI impact assessments. Vendor risk. Supply chain accountability. High-risk sector obligations.", task:"Complete Ch 11. Mongolian post: 'AI-ийн эрсдэлийг хэрхэн удирдах вэ?'", apac:null, exam:"Domain IV.B — Impact assessment" },
          { day:38, chapter:"Ch 12: Ongoing AI Operations", focus:"Continuous improvement. AI governance maturity. Policy updates. Future-proofing.", task:"Read Ch 12 first half. Think: how does a Mongolian org build AI governance over time?", apac:null, exam:"Domain IV.C — Operational governance" },
          { day:39, chapter:"Ch 12: Ongoing AI Operations (cont.)", focus:"AI ethics culture. Governance lifecycle. Emerging issues: agentic AI, GenAI risks.", task:"Complete Ch 12. Full book done! Mongolian post: '30+ хоногийн айвч суралцлагын дүгнэлт'", apac:null, exam:"Domain IV.C — Emerging AI issues" },
          { day:40, chapter:"APAC + Conference Final Prep 🇸🇬", focus:"Review your Singapore conference notes. ASEAN 7 principles. APAC comparison chart.", task:"Finalize your 3 conference talking points. Prepare 2 intelligent questions for panels.", apac:"synthesis", exam:"Conference readiness" },
          { day:41, chapter:"Full Practice Exam #1", focus:"Sybex full-length practice exam. All domains. Simulate real conditions (2 hrs).", task:"Score and review. Log all wrong answers by domain. Identify weakest domain.", apac:null, exam:"Full mock exam", isReview:true },
          { day:42, chapter:"⟳ Week 6 Review", focus:"Targeted review of weakest domain from practice exam. Flashcard blitz.", task:"Re-read weak chapters. 50 flashcards from Sybex. Mongolian post: 'AIGP шалгалтад бэлдэж байна'", apac:null, exam:"Targeted exam prep", isReview:true },
        ]
      },
      {
        id: "exam", label: "Phase 4", title: "Exam Mastery",
        subtitle: "Full Review · Mock Exams", color: "#9B82E8", weeks: "Weeks 7–8",
        days: [
          { day:43, chapter:"Domain I Deep Review", focus:"AI foundations, principles, governance programs. All AIGP BoK v2.1 competencies.", task:"Review all Ch 1–3 notes. Domain I practice questions. Score 80%+ target.", apac:null, exam:"Domain I mastery", isReview:true },
          { day:44, chapter:"Domain II Deep Review — Laws", focus:"Privacy law, sectoral law, EU AI Act. All jurisdictions.", task:"Review Ch 4–6 notes + APAC country summaries. Domain II-Laws practice questions.", apac:null, exam:"Domain II mastery (laws)", isReview:true },
          { day:45, chapter:"Domain II Deep Review — Frameworks", focus:"NIST AI RMF, ISO 42001, OECD, UNESCO, UNICEF, Singapore AI Verify.", task:"Review Ch 7 + framework comparison table. Domain II-Frameworks practice questions.", apac:null, exam:"Domain II mastery (frameworks)", isReview:true },
          { day:46, chapter:"Domain III Deep Review", focus:"AI design, data governance, model training. Full lifecycle.", task:"Review Ch 8–9 notes. Domain III practice questions. Focus on data + bias topics.", apac:null, exam:"Domain III mastery", isReview:true },
          { day:47, chapter:"Domain IV Deep Review", focus:"Deployment, monitoring, risk management, ongoing operations.", task:"Review Ch 10–12 notes. Domain IV practice questions. Focus on risk + assurance.", apac:null, exam:"Domain IV mastery", isReview:true },
          { day:48, chapter:"Full Practice Exam #2", focus:"Second full-length Sybex practice exam. All domains. Real conditions.", task:"Target 80%+. Compare score to Practice Exam #1. Note improvement.", apac:null, exam:"Mock exam #2", isReview:true },
          { day:49, chapter:"⟳ Week 7 Review", focus:"Review all wrong answers from Practice Exam #2. Flashcard review all domains.", task:"Deep dive on any remaining weak spots. Mongolian post: 'AIGP шалгалтад бэлэн болж байна'", apac:null, exam:"Pre-exam consolidation", isReview:true },
          { day:50, chapter:"Exam Essentials Speed Review", focus:"Every chapter's 'Exam Essentials' section from the Sybex guide.", task:"Read Exam Essentials for Ch 1–12. Make final cheat sheet (key terms + definitions).", apac:null, exam:"Exam essentials", isReview:true },
          { day:51, chapter:"APAC Final Review — Conference Week Prep", focus:"Complete APAC regulatory landscape. Singapore focus. Your unique positioning.", task:"Finalize your conference talking points. Your expertise = child protection + AI governance + Global South.", apac:"synthesis", exam:"Conference + exam integration" },
          { day:52, chapter:"Full Practice Exam #3", focus:"Third full-length practice exam or IAPP sample questions.", task:"Target 85%+. This is your final benchmark before the real exam.", apac:null, exam:"Mock exam #3", isReview:true },
          { day:53, chapter:"Light Review Day", focus:"Only your weakest 10 flashcards. No new material.", task:"Rest. Confidence consolidation. Mongolian post: 'AI засаглалын мэдлэгийн аялал'", apac:null, exam:"Pre-exam rest", isReview:true },
          { day:54, chapter:"🎯 Exam Day Prep", focus:"Review exam format: 120 questions, 3 hours. Logistics confirmed.", task:"Light reading only. Sleep early. You are ready.", apac:null, exam:"AIGP Exam — You've got this, Zaya! 🇲🇳", isReview:true },
          { day:55, chapter:"🎉 Post-Exam + Singapore Countdown", focus:"Reflect on exam. Prep final conference materials. Pack for Singapore.", task:"Write a Mongolian post about your AIGP journey. Share your study experience with your network.", apac:"singapore", exam:"IAPP Asia Forum — July 2026 🇸🇬" },
          { day:56, chapter:"🌏 IAPP Asia Forum, Singapore", focus:"You arrive with: AIGP certification, 56 days of deep knowledge, APAC regulatory expertise, child protection + AI governance positioning.", task:"Network. Present your Global South perspective. Connect with Asia-Pacific AI governance leaders.", apac:"synthesis", exam:"Conference Day 🇸🇬" },
        ]
      }
    ];

    const APAC = {
      singapore: { flag:"🇸🇬", name:"Singapore", color:"#E8C547" },
      korea:     { flag:"🇰🇷", name:"South Korea", color:"#5EC4A8" },
      china:     { flag:"🇨🇳", name:"China", color:"#E87D60" },
      "japan-australia": { flag:"🇯🇵🇦🇺", name:"Japan & Australia", color:"#9B82E8" },
      asean:     { flag:"🌏", name:"India & ASEAN", color:"#60A8E8" },
      synthesis: { flag:"🌐", name:"APAC Synthesis", color:"#E8A060" },
    };

    const APAC_CARDS = [
      { flag:"🇸🇬", country:"Singapore", color:"#E8C547", law:"Model AI Gov Framework + Agentic AI Framework (2026)", approach:"Voluntary, principles-based, innovation-first. World's first agentic AI framework." },
      { flag:"🇰🇷", country:"South Korea", color:"#5EC4A8", law:"AI Basic Act (effective Jan 2026)", approach:"APAC's first comprehensive AI law. Risk-based, modeled on EU AI Act." },
      { flag:"🇨🇳", country:"China", color:"#E87D60", law:"Algorithm Rules + Deep Synthesis + GenAI Measures", approach:"Binding, restrictive. Content labeling mandate. State control model." },
      { flag:"🇯🇵", country:"Japan", color:"#9B82E8", law:"Basic Law for Responsible AI (draft)", approach:"Voluntary, innovation-first. Sector-specific. Agile governance philosophy." },
      { flag:"🇦🇺", country:"Australia", color:"#60A8E8", law:"Voluntary AI Safety Standard → principles-based", approach:"Shifted away from EU-style mandatory rules. 6 responsible AI practices." },
      { flag:"🇮🇳", country:"India", color:"#E8A060", law:"DPDP Act (2023) + AI Advisory", approach:"Data-layer governance of AI. Sector-specific guidance. Framework in progress." },
      { flag:"🌏", country:"ASEAN", color:"#82C4E8", law:"ASEAN Guide on AI Governance & Ethics (updated 2025)", approach:"7 principles: transparency, fairness, security, reliability, human-centricity, privacy, accountability. Voluntary only." },
    ];

    function App() {
      const [completed, setCompleted] = useState(() => {
        try { const s = localStorage.getItem("aigp_v1"); return s ? JSON.parse(s) : {}; } catch { return {}; }
      });
      const [activePhase, setActivePhase] = useState(0);
      const [expandedDay, setExpandedDay] = useState(null);

      const allDays = PHASES.flatMap(p => p.days);
      const totalDays = allDays.length;
      const completedCount = Object.values(completed).filter(Boolean).length;
      const progress = Math.round((completedCount / totalDays) * 100);
      const phase = PHASES[activePhase];
      const phaseCompleted = phase.days.filter(d => completed[d.day]).length;
      const phaseProgress = Math.round((phaseCompleted / phase.days.length) * 100);

      function toggleDay(dayNum) {
        const next = { ...completed, [dayNum]: !completed[dayNum] };
        setCompleted(next);
        try { localStorage.setItem("aigp_v1", JSON.stringify(next)); } catch {}
      }

      const circumference = 2 * Math.PI * 30;

      return (
        <div style={{minHeight:"100vh", background:"#0C0F14", color:"#E8E4DC", fontFamily:"'DM Sans',sans-serif", position:"relative"}}>

          {/* HEADER */}
          <header style={{position:"sticky",top:0,zIndex:100,background:"rgba(12,15,20,0.97)",borderBottom:"1px solid rgba(255,255,255,0.06)",backdropFilter:"blur(20px)",padding:"1.25rem 1.5rem 0"}}>
            <div style={{maxWidth:860,margin:"0 auto"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"1rem",flexWrap:"wrap"}}>
                <div>
                  <p style={{fontSize:"0.65rem",letterSpacing:"0.12em",textTransform:"uppercase",color:"rgba(232,228,220,0.3)",marginBottom:"0.3rem"}}>IAPP AIGP · Peter H. Gregory (Wiley/Sybex)</p>
                  <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(1.4rem,4vw,2rem)",fontWeight:900,lineHeight:1.1}}>
                    AI Governance <span style={{color:"#E8C547"}}>Study Plan</span>
                  </h1>
                  <p style={{fontSize:"0.72rem",color:"rgba(232,228,220,0.35)",marginTop:"0.3rem"}}>56 Days · 12 Chapters · 10 APAC Countries · Singapore Conference Ready 🇸🇬</p>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:"1rem"}}>
                  <div style={{textAlign:"right"}}>
                    <span style={{display:"block",fontFamily:"'Playfair Display',serif",fontSize:"1.8rem",fontWeight:700,color:"#E8C547",lineHeight:1}}>{completedCount}</span>
                    <span style={{fontSize:"0.65rem",color:"rgba(232,228,220,0.3)"}}>of {totalDays} days</span>
                  </div>
                  <div style={{position:"relative",width:64,height:64,flexShrink:0}}>
                    <svg width="64" height="64" viewBox="0 0 64 64">
                      <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.07)" strokeWidth="4"/>
                      <circle cx="32" cy="32" r="26" fill="none" stroke="#E8C547" strokeWidth="4"
                        strokeDasharray={`${circumference * progress / 100} ${circumference}`}
                        strokeLinecap="round" strokeDashoffset={circumference * 0.25}
                        transform="rotate(-90 32 32)" style={{transition:"stroke-dasharray 0.5s ease"}}/>
                    </svg>
                    <span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.72rem",fontWeight:600,color:"#E8C547"}}>{progress}%</span>
                  </div>
                </div>
              </div>

              {/* Phase tabs */}
              <div style={{display:"flex",marginTop:"1rem",overflowX:"auto",gap:0}}>
                {PHASES.map((p,i) => (
                  <button key={p.id} className="phase-tab"
                    onClick={() => setActivePhase(i)}
                    style={{flex:1,minWidth:110,display:"flex",flexDirection:"column",alignItems:"center",gap:"0.1rem",
                      padding:"0.5rem 0.4rem 0.7rem",background:"transparent",border:"none",
                      borderBottom:`2px solid ${activePhase===i ? p.color : "transparent"}`,
                      cursor:"pointer",transition:"all 0.2s",
                      color: activePhase===i ? p.color : "rgba(232,228,220,0.3)"}}>
                    <span style={{fontSize:"0.58rem",letterSpacing:"0.1em",textTransform:"uppercase",opacity:0.7}}>{p.label}</span>
                    <span style={{fontSize:"0.75rem",fontWeight:600,textAlign:"center"}}>{p.title}</span>
                    <span style={{fontSize:"0.6rem",opacity:0.6}}>{p.weeks}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Phase subheader */}
          <div style={{maxWidth:860,margin:"1.25rem auto 0.5rem",padding:"0 1.5rem",display:"flex",justifyContent:"space-between",alignItems:"center",borderLeft:`3px solid ${phase.color}`,paddingLeft:"1rem"}}>
            <div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.1rem",fontWeight:700}}>{phase.title}</h2>
              <p style={{fontSize:"0.72rem",color:"rgba(232,228,220,0.4)",marginTop:"0.15rem"}}>{phase.subtitle} · 45–60 min/day · {phase.weeks}</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"0.3rem"}}>
              <div style={{width:110,height:3,background:"rgba(255,255,255,0.07)",borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${phaseProgress}%`,background:phase.color,borderRadius:3,transition:"width 0.4s ease"}}/>
              </div>
              <span style={{fontSize:"0.65rem",fontWeight:600,color:phase.color}}>{phaseCompleted}/{phase.days.length} days</span>
            </div>
          </div>

          {/* Day list */}
          <main style={{maxWidth:860,margin:"0 auto",padding:"0 1.5rem 2rem"}}>
            {phase.days.map(d => {
              const isDone = !!completed[d.day];
              const isExpanded = expandedDay === d.day;
              const apac = d.apac ? APAC[d.apac] : null;
              return (
                <div key={d.day} style={{animation:"fadeIn 0.25s ease both"}}>
                  <div className="day-row"
                    style={{display:"flex",alignItems:"center",gap:"0.7rem",padding:"0.75rem 0.5rem",
                      borderRadius:8,cursor:"pointer",transition:"background 0.15s",
                      borderBottom:"1px solid rgba(255,255,255,0.04)",
                      background: d.isReview ? "rgba(255,255,255,0.015)" : "transparent",
                      opacity: isDone ? 0.45 : 1}}
                    onClick={() => setExpandedDay(isExpanded ? null : d.day)}>

                    <button className="check-btn"
                      onClick={e => { e.stopPropagation(); toggleDay(d.day); }}
                      style={{width:20,height:20,borderRadius:"50%",flexShrink:0,
                        border: isDone ? "none" : "1.5px solid rgba(255,255,255,0.2)",
                        background: isDone ? phase.color : "transparent",
                        cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
                        transition:"all 0.2s",fontSize:"0.55rem",color:"#0C0F14",fontWeight:700}}>
                      {isDone && "✓"}
                    </button>

                    <span style={{fontSize:"0.62rem",fontWeight:700,letterSpacing:"0.06em",width:28,flexShrink:0,
                      textAlign:"center",color: isDone ? "rgba(255,255,255,0.2)" : phase.color}}>
                      {d.isReview ? "⟳" : `D${d.day}`}
                    </span>

                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"0.84rem",fontWeight:500,
                        textDecoration: isDone ? "line-through" : "none",
                        color: isDone ? "rgba(232,228,220,0.3)" : "#E8E4DC"}}>
                        {d.chapter}
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:"0.25rem",marginTop:"0.2rem",alignItems:"center"}}>
                        {apac && (
                          <span style={{fontSize:"0.58rem",padding:"0.1rem 0.45rem",borderRadius:100,
                            background:`${apac.color}18`,color:apac.color,border:`1px solid ${apac.color}40`,fontWeight:500}}>
                            {apac.flag} {apac.name}
                          </span>
                        )}
                        {d.isReview && (
                          <span style={{fontSize:"0.58rem",padding:"0.1rem 0.45rem",borderRadius:100,
                            background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.35)",border:"1px solid rgba(255,255,255,0.1)",fontWeight:500}}>
                            Review
                          </span>
                        )}
                        <span style={{fontSize:"0.6rem",color:"rgba(232,228,220,0.28)",paddingLeft:"0.15rem"}}>{d.exam}</span>
                      </div>
                    </div>

                    <span style={{fontSize:"0.7rem",color:"rgba(232,228,220,0.2)",transition:"transform 0.2s",flexShrink:0,
                      transform: isExpanded ? "rotate(180deg)" : "rotate(0deg)"}}>▾</span>
                  </div>

                  {isExpanded && (
                    <div style={{margin:"0 0 0.5rem 2.5rem",padding:"1rem 1.25rem",
                      background:"rgba(255,255,255,0.025)",borderRadius:"0 8px 8px 0",
                      borderLeft:`2px solid ${phase.color}`,animation:"fadeIn 0.2s ease"}}>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.7rem 1.25rem",marginBottom:"0.75rem"}}>
                        {[
                          ["📖 Today's Focus", d.focus, "rgba(232,228,220,0.7)"],
                          ["✅ Daily Task", d.task, "rgba(232,228,220,0.7)"],
                          ["🎯 AIGP Exam Alignment", d.exam, phase.color],
                          apac ? ["🌏 APAC Relevance", `${apac.flag} ${apac.name} — Singapore conference context`, apac.color] : null
                        ].filter(Boolean).map(([label, text, color]) => (
                          <div key={label}>
                            <p style={{fontSize:"0.6rem",letterSpacing:"0.08em",textTransform:"uppercase",color:"rgba(232,228,220,0.3)",marginBottom:"0.2rem"}}>{label}</p>
                            <p style={{fontSize:"0.8rem",lineHeight:1.65,color}}>{text}</p>
                          </div>
                        ))}
                      </div>
                      <button onClick={() => toggleDay(d.day)}
                        style={{padding:"0.4rem 1rem",borderRadius:7,border:"none",
                          fontSize:"0.76rem",fontWeight:600,cursor:"pointer",
                          fontFamily:"'DM Sans',sans-serif",transition:"all 0.2s",
                          background: isDone ? "rgba(255,255,255,0.06)" : phase.color,
                          color: isDone ? "rgba(232,228,220,0.4)" : "#0C0F14"}}>
                        {isDone ? "Mark Incomplete" : "Mark Complete ✓"}
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </main>

          {/* APAC Reference */}
          <div style={{maxWidth:860,margin:"0 auto",padding:"2rem 1.5rem 3rem",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.1rem",fontWeight:700,marginBottom:"1rem"}}>
              🌏 APAC Quick Reference — Singapore Conference Prep
            </h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:"0.7rem",marginBottom:"1.25rem"}}>
              {APAC_CARDS.map(c => (
                <div key={c.country} style={{padding:"0.85rem",background:"rgba(255,255,255,0.025)",
                  border:"1px solid rgba(255,255,255,0.07)",borderTop:`2px solid ${c.color}`,borderRadius:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:"0.4rem",marginBottom:"0.35rem"}}>
                    <span style={{fontSize:"1rem"}}>{c.flag}</span>
                    <span style={{fontSize:"0.76rem",fontWeight:700,color:c.color}}>{c.country}</span>
                  </div>
                  <p style={{fontSize:"0.68rem",color:"rgba(232,228,220,0.6)",marginBottom:"0.3rem",fontWeight:500}}>{c.law}</p>
                  <p style={{fontSize:"0.65rem",color:"rgba(232,228,220,0.38)",lineHeight:1.55}}>{c.approach}</p>
                </div>
              ))}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:"1rem",padding:"1rem 1.25rem",
              background:"rgba(232,197,71,0.07)",border:"1px solid rgba(232,197,71,0.2)",borderRadius:12}}>
              <span style={{fontSize:"1.8rem",flexShrink:0}}>✈️</span>
              <div>
                <p style={{fontSize:"0.88rem",fontWeight:700,color:"#E8C547",marginBottom:"0.15rem"}}>IAPP Asia Forum 2026 — Singapore</p>
                <p style={{fontSize:"0.72rem",color:"rgba(232,228,220,0.45)",lineHeight:1.5}}>
                  July 2026 · You arrive as a certified AI governance professional with 56 days of deep APAC regulatory knowledge
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
